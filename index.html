<!doctype html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1f7a5a">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<title>BudgetSimple MG</title>
<style>
:root{--bg:#f5f7f4;--card:#fff;--tx:#1b231e;--mu:#65706a;--ac:#1f7a5a;--bd:#dfe4de;--ok:#1f9d6b;--wa:#e08a1e;--ko:#d64545;color-scheme:light dark}
@media (prefers-color-scheme:dark){:root{--bg:#121613;--card:#1b211d;--tx:#eef2ee;--mu:#9aa59e;--ac:#3fbf8f;--bd:#2c352f}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,Segoe UI,Roboto,sans-serif}
main{max-width:600px;margin:0 auto;padding:16px 16px 90px;padding-top:max(16px,env(safe-area-inset-top))}h1{font-size:20px;margin:4px 0 12px}h2{font-size:16px;margin:0 0 10px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;margin-bottom:12px}
.big{font-size:30px;font-weight:700}.mu{color:var(--mu);font-size:14px}.row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.st{border-radius:14px;padding:16px;color:#fff;margin-bottom:12px}
input,select,button{font:inherit;color:var(--tx)}input,select{width:100%;padding:12px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);margin-bottom:8px}
button,.btn{border:0;border-radius:10px;padding:12px 16px;background:var(--ac);color:#fff;font-weight:600;min-height:44px;cursor:pointer;text-decoration:none;display:inline-block;text-align:center}
.g{background:transparent;color:var(--ac);border:1px solid var(--bd)}.d{background:var(--ko);color:#fff}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--card);border-top:1px solid var(--bd);padding-bottom:env(safe-area-inset-bottom)}
nav a{flex:1;text-align:center;padding:14px 2px;color:var(--mu);text-decoration:none;font-size:12px}nav a.on{color:var(--ac);font-weight:700}
.it{padding:10px 0;border-top:1px solid var(--bd)}.bar{height:14px;border-radius:7px;margin:4px 0 10px}
.pie{width:140px;height:140px;border-radius:50%;flex:none}.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px}
label.c{display:flex;gap:8px;align-items:center;margin-bottom:8px}label.c input{width:auto;margin:0}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}.grid input{margin:2px 0 0;padding:8px}
.seg{display:flex;background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:4px;margin-bottom:12px;gap:4px}.seg a{flex:1;text-align:center;padding:10px 6px;border-radius:9px;color:var(--mu);text-decoration:none;font-weight:600;font-size:14px}.seg a.on{background:var(--ac);color:#fff}
.split{display:flex;height:16px;border-radius:8px;overflow:hidden;margin:6px 0 10px}details.cat{border-top:1px solid var(--bd);padding:10px 0}details.cat summary{cursor:pointer;list-style:none}details.cat summary::-webkit-details-marker{display:none}details.cat .it{padding:6px 0 6px 16px;font-size:14px;border-top:0}
.mchart{display:flex;gap:4px;height:130px}.mc{flex:1;display:flex;flex-direction:column;align-items:center;font-size:10px;color:var(--mu)}.mcw{flex:1;width:100%;display:flex;align-items:flex-end}.mcb{width:100%;border-radius:4px 4px 0 0;min-height:2px}
.tip{border-left:4px solid var(--wa)}.rk{display:inline-block;width:22px;height:22px;line-height:22px;text-align:center;border-radius:50%;background:var(--bg);font-size:12px;font-weight:700;margin-right:8px}
#toast{position:fixed;left:50%;bottom:80px;transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:14px;max-width:90%;display:none;z-index:9}
.hide{display:none}
</style></head><body>
<main><h1 id="ttl">BudgetSimple MG</h1><div id="app"></div></main>
<nav id="nav"></nav>
<div id="toast"></div>
<script src="app.js"></script>
</body></html>
